default_stages: [commit]
files: ^Eco\.Python2ACOM/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: debug-statements

  - repo: local
    hooks:
      - id: black
        name: black
        entry: bash -c 'cd Eco.Python2ACOM && poetry run black .' --
        language: system
        pass_filenames: false
        types: [python]
        files: ^Eco\.Python2ACOM/

      - id: isort
        name: isort
        entry: bash -c 'cd Eco.Python2ACOM && poetry run isort .' --
        language: system
        pass_filenames: false
        types: [python]
        files: ^Eco\.Python2ACOM/

      - id: ruff
        name: ruff
        entry: bash -c 'cd Eco.Python2ACOM && poetry run ruff check .' --
        language: system
        pass_filenames: false
        types: [python]
        files: ^Eco\.Python2ACOM/

      - id: mypy
        name: mypy
        entry: bash -c 'cd Eco.Python2ACOM && poetry run mypy .' --
        language: system
        pass_filenames: false
        types: [python]
        files: ^Eco\.Python2ACOM/

      - id: pytest
        name: pytest
        entry: bash -c 'cd Eco.Python2ACOM && poetry run pytest'
        language: system
        pass_filenames: false
        types: [python]
        files: ^Eco\.Python2ACOM/
