site_name: eco-python2acom
site_description: Python bridge for ACOM component technology (EcoOS)
repo_url: https://github.com/peerf-eco/Eco.Core
repo_name: Eco.Core
copyright: Copyright &copy; 2024 Sergei Vdovenkov

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: deep purple
      accent: deep orange
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/puzzle-outline
  favicon: https://avatars.githubusercontent.com/u/9919?s=32
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/peerf-eco/Eco.Core
      name: GitHub

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google
            filters:
              - "!^_"
            show_signature_annotations: true
            separate_signature: true
            line_length: 90

markdown_extensions:
  - toc:
      toc_depth: 4

nav:
  - Home: index.md
  - Decorators:
    - Layout: decorators/layout.md
    - Interface: decorators/interface.md
  - Types:
    - Primitives: types/primitives.md
    - Pointer: types/pointer.md
    - Array: types/array.md
    - UGUID: types/guid.md
    - Errors: types/errors.md
    - Utilities: types/utils.md
  - GUIDs:
    - IID: guids/iid.md
    - CID: guids/cid.md
    - GID: guids/gid.md
  - Runtime:
    - EcoSystem: runtime/system.md
    - Loader: runtime/loader.md
  - Interfaces:
    - Base: interfaces/base.md
    - System: interfaces/system.md
    - Connections: interfaces/connections.md
    - Interface Bus: interfaces/interface_bus.md
    - Memory Manager: interfaces/memory_manager.md
    - File Manager: interfaces/file_manager.md
